en:{h1:"Run OBS from your phone.",sub:"LiveDeck turns your phone, iPad, or tablet into a button panel like a Stream Deck. Free to use, Pro is just Rp30,000 one time.",dl:"Download for Windows",seeprice:"See how to use it",req:"Needs Windows 10/11 and OBS 28 or newer. Phone and PC on the same Wi-Fi.",try:"Tap Overlay, Video, and Replay: buttons stay lit while active.",how:"From download to ready to use",ft:"What your buttons can do",f1t:"OBS control",f1d:"Switch scenes, mute audio, show or hide sources, play or pause media, start and stop streaming or recording.",f2t:"Multi action",f2d:"One button runs a sequence of actions with delays. It stays lit while a source inside it is visible.",f3t:"Soundboard",f3d:"Play sounds on your PC straight into the stream. Buttons show the remaining time.",f4t:"PC actions",f4d:"Send keyboard shortcuts, open apps, files, or links.",f5t:"Pages and folders",f5d:"Arrange buttons per page, set grid size, theme, and icons.",f6t:"No app store",f6d:"Open it in a browser on Android, iPhone, iPad, or tablet. Scan a QR and connect, no account needed.",navhow:"How to use",navprice:"Pricing",ph1:"A. Install on your PC",ph2:"B. Connect OBS and your phone",ph3:"C. Set up your buttons and go",ph4:"If something goes wrong",x1t:"Download the installer",x1d:"Click Download for Windows on this page. Or open the Releases page on GitHub and download the LiveDeck-Setup (.exe) file from Assets.",x2t:"Run the installer",x2d:"Double-click the downloaded file, choose an install folder, and finish the setup.",tip2:"If Windows shows a warning, click More info, then Run anyway. This is normal because the installer is not signed yet.",x3t:"Allow the firewall",x3d:"When LiveDeck first opens, Windows asks about network access. Tick Private networks and click Allow. Without it your phone cannot connect.",x4t:"Enable WebSocket in OBS",x4d:"In OBS open Tools, WebSocket Server Settings. Tick Enable WebSocket server, keep port 4455, set a password (or click Generate Password), and click OK.",x5t:"Connect LiveDeck to OBS",x5d:"In LiveDeck open the Settings tab, Connection card. Enter the OBS password from step 4 and click Save. The top bar should say OBS: connected.",x6t:"Open the panel on your phone",x6d:"Make sure your phone and PC use the same Wi-Fi or hotspot. In the Connection card, scan the QR code with your phone camera. The panel opens and connects right away. Without the QR, type the address shown into your phone browser and enter the PIN.",tip6:"To make it feel like an app: on iPhone/iPad use Safari, Share, Add to Home Screen. On Android use Chrome, the three-dot menu, Add to Home screen.",x7t:"Set up your buttons",x7d:"Open the Layout tab and click a cell. Pick an action (switch scene, mute, play media, and more), choose the scene or audio from the OBS list, then pick an icon. Click Save and the phone panel updates right away.",x8t:"Try it from your phone",x8d:"Tap a button. It lights up when a scene is active, the mic is on, a source is visible, media is playing, or a sound is running.",x9t:"Activate Pro (optional)",x9d:"Have a license key? Open Settings, the License card, paste the key, and click Activate.",tr1q:"LiveDeck says OBS is not connected",tr1a:"Make sure OBS is open, WebSocket is enabled, and the port and password in LiveDeck match OBS.",tr2q:"My phone cannot open the panel",tr2a:"Check that the phone and PC share one Wi-Fi, the firewall allows Private networks, and your router has no AP isolation. Try your phone hotspot instead.",tr3q:"A button does nothing",tr3a:"Pick scene, audio, or source names from the OBS list instead of typing them. Click Reload OBS lists if the list is empty.",f7t:"Glowing buttons",f7d:"Buttons glow while a source is visible, media is playing, or a sound is running, so you always know your live status.",f8t:"Save Replay Buffer",f8d:"Save the last moments of your stream with one tap. Works with the OBS Replay Buffer and the Source Record plugin. The button lights up while the buffer is active.",f9t:"One-click updates",f9d:"LiveDeck can start with Windows and update itself from inside the app, with a list of what is new.",rtoast:"Replay saved",tr4q:"The Save Replay button says the buffer is not active",tr4a:"In OBS enable the Replay Buffer (Settings, Output, Replay Buffer, Enable) and click Start Replay Buffer. With the Source Record plugin, enable its filter and tick Replay Buffer.",pt:"Free to start, Pro is one payment",free:"Free",rp:"Price",r1:"Grid size",v1:"up to 8×8",r2:"Pages",p3:"3 pages",unl:"Unlimited",r3:"Devices",many:"Multiple",r4:"All actions and soundboard",r5:"Custom button colors",r6:"Custom themes",r7:"Upload your own images",yes:"Yes",once:"Pro is paid once and yours for life.",bt:"How to buy Pro",b1:"Contact me on TikTok or Discord.",b2:"Pay Rp30,000.",b3:"Receive a license key, paste it in the License card, then click Activate.",qt:"FAQ",q1:"Why does Windows show a warning?",a1:"The installer is not signed yet. Click More info, then Run anyway.",q2:"Do I need internet?",a2:"No. Your PC and phone just need the same Wi-Fi or hotspot. Internet is only used to check for updates.",q3:"Does it work away from home?",a3:"Not yet. For now it works on the same local network only.",q4:"Is this an official Elgato or OBS product?",a4:"No. LiveDeck is independent and not affiliated with Elgato or the OBS Project.",legal:"Stream Deck is a trademark of Elgato."}};

else if(ty==="snd"){b.classList.remove("play");void b.offsetWidth;b.classList.add("play")}
